<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local AI</title>
  <script>try { var theme = localStorage.getItem("theme"); if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme; } catch (e) {}</script>
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <span>Local AI</span>
    </div>
    <button id="palette" class="ghost small" type="button" title="Commands and chats">Commands <kbd>Ctrl K</kbd></button>
    <button id="lang" class="ghost small" type="button"></button>
    <button id="theme" class="ghost small" type="button"></button>
    <div id="status" class="status" title="">connecting…</div>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Sections">
      <div class="tabs" role="tablist">
        <button class="tab active" data-view="new" role="tab">Chats</button>
        <button class="tab" data-view="projects" role="tab">Projects</button>
        <button class="tab" data-view="memory" role="tab">Memory</button>
        <button class="tab" data-view="skills" role="tab">Skills</button>
      </div>
      <div id="side-list" class="side-list"></div>
    </nav>

    <main>
      <section id="view-new" class="view chat">
        <div class="chat-main">
          <div id="timeline" class="timeline"></div>
          <form id="ask" class="ask">
            <div class="ask-row new-only">
              <div class="modes" role="tablist" aria-label="Mode">
                <button type="button" class="mode active" data-mode="research" role="tab">Research</button>
                <button type="button" class="mode" data-mode="code" role="tab">Code</button>
              </div>
              <div id="target" class="target muted" hidden></div>
            </div>
            <div id="chat-info" class="chat-info muted" hidden></div>
            <div id="settings" class="settings" hidden>
              <label>Model
                <select id="set-model"><option value="">Default</option></select>
              </label>
              <label title="Higher is more varied, lower more exact">Temperature
                <input id="set-temperature" type="number" min="0" max="2" step="0.05" placeholder="0.6">
              </label>
              <label title="Tokens per model reply, thinking included">Max tokens
                <input id="set-max_tokens" type="number" min="256" max="65536" step="256" placeholder="8192">
              </label>
              <label class="code-only" title="Model replies in one run">Max turns
                <input id="set-max_turns" type="number" min="1" max="500" placeholder="80">
              </label>
              <label class="code-only" title="The conversation is compacted above this many characters (about 3 per token). Keep it below the context length set in LM Studio.">Context limit (characters)
                <input id="set-context_chars" type="number" min="20000" max="2000000" step="10000" placeholder="300000">
              </label>
              <label class="research-only" title="Tool-calling steps per sub-question">Max steps
                <input id="set-max_steps" type="number" min="1" max="100" placeholder="12">
              </label>
              <button id="set-reset" class="ghost small" type="button">Defaults</button>
              <span class="muted note">Empty = default. Saved with this chat.</span>
            </div>
            <textarea id="question" rows="2" placeholder="Ask a research question — any language." required></textarea>
            <div class="ask-row code-only new-only" hidden>
              <input id="folder" placeholder="Project folder, absolute path (e.g. C:\Users\you\Github\test\app)">
              <button id="browse" class="ghost" type="button">Browse…</button>
            </div>
            <div class="ask-row">
              <span class="ask-row research-only">
                <input id="project" class="new-only" placeholder="Project name (optional)">
                <label class="opt">Parallel
                  <select id="parallel"><option>1</option><option>2</option><option>3</option><option>4</option></select>
                </label>
                <label class="opt" title="Skip review, gap check and learning"><input type="checkbox" id="fast"> <span>Fast</span></label>
                <label class="opt" title="Quick answer: one tool loop, no plan or report"><input type="checkbox" id="quick"> <span>Quick</span></label>
              </span>
              <span id="mcp-section" class="mcp-row" hidden>
                <span class="mcp-label muted">MCP</span>
                <span id="mcp-selectors" class="mcp-chips"></span>
              </span>
              <span class="spacer"></span>
              <span id="meter" class="meter" hidden></span>
              <button id="compact" class="ghost" type="button" title="Shorten the conversation before the next reply: the model writes notes, the plan stays" hidden>Compact</button>
              <button id="settings-toggle" class="ghost" type="button" title="Model and settings of this chat" aria-expanded="false"></button>
              <button id="cancel" class="ghost" type="button" hidden>Cancel</button>
              <button id="run" class="primary" type="submit">Research</button>
            </div>
          </form>
        </div>
        <aside id="side-panel" class="side-panel" aria-label="Progress" hidden></aside>
      </section>

      <section id="view-project" class="view page" hidden></section>
      <section id="view-memory" class="view page" hidden>
        <form id="memory-search" class="row">
          <input id="memory-q" placeholder="Search memory (facts, lessons, preferences)">
          <button class="ghost" type="submit">Search</button>
        </form>
        <ul id="memory-list" class="memory-list"></ul>
      </section>
      <section id="view-skills" class="view page" hidden>
        <div id="skills-list" class="cards"></div>
        <p class="muted">Add your own skills as Markdown files in <code>&lt;workspace&gt;/skills/</code>.</p>
      </section>
    </main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/static/vendor/katex/katex.min.js"></script>
  <script src="/static/rich.js"></script>
  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
